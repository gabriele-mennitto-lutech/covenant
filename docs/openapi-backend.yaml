        '502':
          description: Servizio cve-search non raggiungibile o risposta non valida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/cves:
    get:
      tags:
      - CVE
      summary: Elenco CVE tracciate dal SOC (filtrato e paginato lato server)
      description: Usare `stato=IN_ANALISI` per le CVE in carico e `stato=ARCHIVIATA` per lo storico.
      parameters:
      - in: query
        name: stato
        schema:
          type: string
          enum:
          - IN_ANALISI
          - ARCHIVIATA
      - in: query
        name: search
        schema:
          type: string
        description: Ricerca su problem ID, CVE, prodotto, riepilogo, note, motivo attesa, esito, errata
      - in: query
        name: severita
        schema:
          type: string
        description: CRITICAL,HIGH,MEDIUM,LOW,NONE derivate dallo score (separati da virgola)
      - in: query
        name: stato_ticket
        schema:
          type: string
        description: Stato del problem sul sito (separati da virgola)
      - in: query
        name: impattato
        schema:
          type: string
        description: SI,NO,DA_VERIFICARE (separati da virgola)
      - in: query
        name: motivo_attesa
        schema:
          type: string
        description: Separati da virgola
      - in: query
        name: esito
        schema:
          type: string
        description: Separati da virgola (VULN_CLIENT, APP_NON_PRESENTE, PROSSIMO_PATCHING, NON_IMPATTANTE, NON_IN_CARICO_SOC, ALTRO). ALTRO = tutte le motivazioni custom/non standard
      - in: query
        name: flagged
        schema:
          type: boolean
        description: true = solo problem flaggati da girare post-riunione
      - in: query
        name: date_field
        schema:
          type: string
          enum:
          - data_inoltro
          - data_archiviazione
          - ultima_revisione
        description: Colonna data filtrata da from/to (default data_inoltro)
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: date_field >= from
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: date_field <= to
      - in: query
        name: sortBy
        schema:
          type: string
      - in: query
        name: sortOrder
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: pageSize
        schema:
          type: integer
      responses:
        '200':
          description: Pagina di CVE
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cve'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  totalPages:
                    type: integer
        '500':
          description: Errore interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - CVE
      summary: Aggiunge una CVE al tracciamento (stato iniziale IN_ANALISI)
      description: Vendor, prodotto e score non indicati vengono completati (best effort) con i dati di cve-search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cve'
      responses:
        '201':
          description: CVE creata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cve:
                    $ref: '#/components/schemas/Cve'
        '400':
          description: Payload non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Problem ID gia tracciato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/cves/stats:
    get:
      tags:
      - CVE
      summary: Conteggio CVE in analisi e archiviate
      responses:
        '200':
          description: Conteggi
          content:
            application/json:
              schema:
                type: object
                properties:
                  inAnalisi:
                    type: integer
                    example: 12
                  archiviate:
                    type: integer
                    example: 340
                  total:
                    type: integer
                    example: 352
  /api/cves/bulk/status:
    put:
      tags:
      - CVE
      summary: Archivia / riporta in analisi / aggiorna motivo attesa / flagga piu CVE (es. durante e dopo la riunione)
      description: Almeno uno tra stato, esito, motivo_attesa, ultima_revisione e flagged e obbligatorio. I cambi di motivo attesa finiscono nello storico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ids
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  example:
                  - 1
                  - 2
                  - 3
                stato:
                  type: string
                  enum:
                  - IN_ANALISI
                  - ARCHIVIATA
                esito:
                  type: string
                  nullable: true
                  example: NON_IMPATTANTE
                  description: Codice standard o motivazione custom (Altro)
                motivo_attesa:
                  type: string
                  nullable: true
                  example: In attesa patch vendor
                ultima_revisione:
                  type: string
                  nullable: true
                  example: '2026-10-22'
                flagged:
                  type: boolean
                  example: true
      responses:
        '200':
          description: CVE aggiornate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  updated:
                    type: integer
        '400':
          description: Payload non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/cves/import:
    post:
      tags:
      - CVE
      summary: Importa i problem/CVE dall'export CSV di ITSM
      description: |
        Il corpo della richiesta e il contenuto del file CSV (separatore `;`, `,` o tab; campi tra virgolette ammessi, anche multilinea).
        Intestazioni: `ID problema*+`, `Data ultima modifica`, `Data inoltro`, `Riepilogo*`, `Stato*`, `Note`.
        Le date sono nel formato ITSM `gg/mm/aaaa hh.mm.ss`. Il Riepilogo deve contenere l'ID CVE
        (es. `Vulnerabilità - CVE-2026-69397 - Microsoft OpenSSH per Windows`).
        Upsert per ID problema: Stato `Pendente` -> problem attivo (de-archiviato se necessario), altrimenti archiviato.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              example: |-
                ID problema*+;Data ultima modifica;Data inoltro;Riepilogo*;Stato*;Note
                PBI00000002751;22/10/2026 13.43.04;22/10/2026 13.25.05;Vulnerabilità - CVE-2026-69397 - Microsoft OpenSSH per Windows;Pendente;"Buongiorno, con la presente..."
      responses:
        '200':
          description: Esito import (righe scartate in `errors`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CveImportResult'
        '400':
          description: File non valido (colonne obbligatorie mancanti, nessuna riga valida...)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
  /api/cves/export:
    get:
      tags:
      - CVE
      summary: Esporta in CSV i problem/CVE in analisi o archiviati
      description: |
        Accetta gli stessi filtri di `GET /api/cves` (paginazione esclusa) ed esporta tutte le righe corrispondenti
        (max 50000). Separatore `;`, codifica UTF-8 con BOM. Le prime colonne coincidono con il template di import
        (`ID problema*+`, `Data ultima modifica`, `Data inoltro`, `Riepilogo*`, `Stato*`, `Note`), seguono CVE, Vendor,
        Prodotto, Score, Impatto, Sezione, Motivo attesa, Ultima revisione, Esito, Data archiviazione, Flag.
      parameters:
      - in: query
        name: stato
        schema:
          type: string
          enum:
          - IN_ANALISI
          - ARCHIVIATA
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: severita
        schema:
          type: string
      - in: query
        name: impattato
        schema:
          type: string
      - in: query
        name: esito
        schema:
          type: string
      - in: query
        name: flagged
        schema:
          type: boolean
      - in: query
        name: date_field
        schema:
          type: string
          enum:
          - data_inoltro
          - data_archiviazione
          - ultima_revisione
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: to
        schema:
          type: string
          format: date
      - in: query
        name: sortBy
        schema:
          type: string
      - in: query
        name: sortOrder
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: File CSV
          content:
            text/csv:
              schema:
                type: string
        '400':
          description: Troppe righe da esportare
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/cves/enrich:
    post:
      tags:
      - CVE
      summary: Completa i campi mancanti (vendor, prodotto, score) delle CVE indicate tramite cve-search
      description: |
        Per ogni CVE vengono valorizzati solo i campi vuoti; i valori gia presenti non vengono mai sovrascritti.
        Massimo 100 CVE per richiesta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ids
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  example:
                  - 1
                  - 2
      responses:
        '200':
          description: Esito per CVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CveEnrichResult'
        '400':
          description: Payload non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/cves/{id}/history:
    get:
      tags:
      - CVE
      summary: Storico dei motivi di attesa di una CVE (dal piu recente)
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Storico
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CveMotivoHistory'
        '404':
          description: CVE non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/cves/{id}:
    get:
      tags:
      - CVE
      summary: Dettaglio CVE tracciata
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: CVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cve'
        '404':
          description: CVE non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - CVE
      summary: Aggiorna una CVE (anche cambio stato IN_ANALISI / ARCHIVIATA)
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cve'
      responses:
        '200':
          description: CVE aggiornata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cve:
                    $ref: '#/components/schemas/Cve'
        '400':
          description: Payload non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: CVE non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - CVE
      summary: Rimuove una CVE dal tracciamento
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: CVE eliminata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: CVE non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
tags: []
