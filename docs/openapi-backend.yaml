  /api/hosts:
    get:
      tags:
      - Hosts
      summary: Elenco host con filtri, ordinamento e paginazione
      description: Restituisce la lista host dalla cache backend applicando globalSearch e filtri per colonna.
      parameters:
      - in: query
        name: globalSearch
        schema:
          type: string
        description: Ricerca full-text su tutti i campi host.
      - in: query
        name: hostname
        schema:
          type: string
      - in: query
        name: applicazione
        schema:
          type: string
      - in: query
        name: riferimento
        schema:
          type: string
      - in: query
        name: ambiente
        schema:
          type: string
      - in: query
        name: company
        schema:
          type: string
      - in: query
        name: servizio
        schema:
          type: string
      - in: query
        name: appliance
        schema:
          type: string
      - in: query
        name: zona
        schema:
          type: string
      - in: query
        name: riferimentoEs
        schema:
          type: string
      - in: query
        name: locazione
        schema:
          type: string
      - in: query
        name: os
        schema:
          type: string
      - in: query
        name: manutenzione
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: nodo
        schema:
          type: string
      - in: query
        name: note
        schema:
          type: string
      - in: query
        name: pianificazione
        schema:
          type: string
      - in: query
        name: rfc
        schema:
          type: string
      - in: query
        name: fixed
        schema:
          type: string
      - in: query
        name: fixable
        schema:
          type: string
      - in: query
        name: divisione
        schema:
          type: string
      - in: query
        name: excludeManutenzione
        schema:
          type: string
      - in: query
        name: osFamily
        description: Famiglie Windows (client), Windows Server e other; valori separati da virgola.
        schema:
          type: string
          example: Windows,Windows Server,other
      - in: query
        name: preset
        schema:
          type: string
          enum:
          - no_app
          - no_serv
          - no_maint
          - no_loc
          - test_env
          - prod_env
          - windows
          - windows_server
      - in: query
        name: sortCol
        schema:
          type: string
      - in: query
        name: sortDir
        schema:
          type: integer
          enum:
          - 1
          - -1
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: Lista host filtrata
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Host'
                  totalCount:
                    type: integer
              example:
                items:
                - id: 42
                  hostname: srv-app-001
                  ambiente: PRODUZIONE
                  company: RAI
                  appliance: false
                  zona: DMZ
                  os: Windows Server 2022
                  status: true
                  nodo: 1
                  fixed: false
                  fixable: true
                totalCount: 1
        '400':
          description: Parametri non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid query parameters
        '404':
          description: Nessun host trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No hosts found
        '500':
          description: Errore interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Internal server error
    post:
      tags:
      - Hosts
      summary: Crea un nuovo host
      description: |-
        L'id viene assegnato dal dataservice e restituito nella risposta.
        Piu' host con stesso hostname e ambiente sono ammessi solo se dismessi/spenti.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Host'
            example:
              hostname: srv-new-001
              ambiente: PRODUZIONE
              company: RAI
              appliance: false
              zona: DMZ
              os: Windows 11
              status: true
              nodo: 1
              fixed: false
              fixable: true
      responses:
        '201':
          description: Host creato
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  host:
                    $ref: '#/components/schemas/Host'
        '400':
          description: Payload non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Hostname and Ambiente are required
        '404':
          description: Risorsa correlata non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Referenced resource not found
        '409':
          description: Esiste gia' un host attivo con lo stesso hostname e ambiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Errore di comunicazione col dataservice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
