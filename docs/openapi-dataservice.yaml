  /data/cves/bulk/status:
    put:
      tags:
      - CVE
      summary: Aggiorna stato / esito / motivo attesa / flag di piu CVE in un'unica transazione
      description: Ogni cambio di motivo attesa viene registrato nello storico. L'archiviazione rimuove il flag.
      parameters:
      - in: header
        name: X-Actor
        schema:
          type: string
        description: Utente che effettua la modifica (per lo storico)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ids
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                stato:
                  type: string
                  enum:
                  - IN_ANALISI
                  - ARCHIVIATA
                esito:
                  type: string
                  nullable: true
                motivo_attesa:
                  type: string
                  nullable: true
                ultima_revisione:
                  type: string
                  nullable: true
                flagged:
                  type: boolean
      responses:
        '200':
          description: CVE aggiornate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  updated:
                    type: integer
        '400':
          description: Payload non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /data/cves/import:
    post:
      tags:
      - CVE
      summary: Importa (upsert per problem ID) i problem esportati da ITSM
      description: |
        Ogni riga viene inserita o aggiornata in base al `problem_id`.
        Stato "Pendente" -> problem attivo (IN_ANALISI, eventualmente de-archiviato);
        qualsiasi altro stato -> problem archiviato. L'intero import avviene in un'unica transazione.
      parameters:
      - in: header
        name: X-Actor
        schema:
          type: string
        description: Utente che effettua l'import (per lo storico)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rows
              properties:
                rows:
                  type: array
                  items:
                    $ref: '#/components/schemas/CveImportRow'
      responses:
        '200':
          description: Esito import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CveImportResult'
        '400':
          description: Payload non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
