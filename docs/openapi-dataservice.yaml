  /data/cves:
    get:
      tags:
      - CVE
      summary: Elenco CVE tracciate (filtrato e paginato)
      parameters:
      - in: query
        name: stato
        schema:
          type: string
          enum:
          - IN_ANALISI
          - ARCHIVIATA
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: severita
        schema:
          type: string
        description: CRITICAL,HIGH,MEDIUM,LOW,NONE derivate dallo score (separati da virgola)
      - in: query
        name: stato_ticket
        schema:
          type: string
        description: Stato sul sito (es. Pendente, In analisi), separati da virgola
      - in: query
        name: impattato
        schema:
          type: string
        description: Valori separati da virgola
      - in: query
        name: motivo_attesa
        schema:
          type: string
        description: Valori separati da virgola
      - in: query
        name: esito
        schema:
          type: string
        description: Valori separati da virgola. ALTRO = tutte le motivazioni non standard
      - in: query
        name: flagged
        schema:
          type: boolean
        description: true = solo problem flaggati, false = solo non flaggati
      - in: query
        name: date_field
        schema:
          type: string
          enum:
          - data_inoltro
          - data_archiviazione
          - ultima_revisione
        description: Colonna data usata da from/to (default data_inoltro)
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: date_field >= from
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: date_field <= to
      - in: query
        name: sortBy
        schema:
          type: string
      - in: query
        name: sortOrder
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: pageSize
        schema:
          type: integer
      responses:
        '200':
          description: Pagina di CVE
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CveRecord'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        '500':
          description: Errore DB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - CVE
      summary: Inserisce una CVE da tracciare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CveRecord'
      responses:
        '201':
          description: CVE creata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cve:
                    $ref: '#/components/schemas/CveRecord'
        '400':
          description: Payload non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Problem ID gia presente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /data/cves/stats:
