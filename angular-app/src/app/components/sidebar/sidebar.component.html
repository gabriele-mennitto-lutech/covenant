<aside class="sidebar" [class.collapsed]="isCollapsed">
    <div class="sidebar-header">
        <button class="toggle-sidebar-btn" (click)="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="logo-container">
            <img src="/logo.svg" alt="Logo" class="sidebar-logo">
            <span class="nav-text" style="font-size: 1.1rem; flex-shrink: 0;"><strong style="font-weight: 700;">SOC INFRA</strong>&nbsp;<span style="font-weight: 400;">Covenant</span></span>
        </div>
    </div>
    <ul class="nav-links">
        <li routerLinkActive="active" title="Dashboard">
            <a routerLink="/dashboard" style="display: flex; align-items: center; width: 100%; color: inherit; text-decoration: none; gap: 12px;">
                <i class="fa-solid fa-gauge" style="width: 20px; text-align: center;"></i>
                <span class="nav-text">Dashboard</span>
            </a>
        </li>
        <li routerLinkActive="active" title="Sites">
            <a routerLink="/sites" style="display: flex; align-items: center; width: 100%; color: inherit; text-decoration: none; gap: 12px;">
                <i class="fa-solid fa-globe" style="width: 20px; text-align: center;"></i>
                <span class="nav-text">Sites</span>
            </a>
        </li>

        <li routerLinkActive="active" title="Hosts">
            <a routerLink="/hosts" style="display: flex; align-items: center; width: 100%; color: inherit; text-decoration: none; gap: 12px;">
                <i class="fa-solid fa-network-wired" style="width: 20px; text-align: center;"></i>
                <span class="nav-text">Hosts</span>
            </a>
        </li>
        <li routerLinkActive="active" title="Fixes">
            <a routerLink="/fixes" style="display: flex; align-items: center; width: 100%; color: inherit; text-decoration: none; gap: 12px;">
                <i class="fa-solid fa-wrench" style="width: 20px; text-align: center;"></i>
                <span class="nav-text">Fixes</span>
            </a>
        </li>
        <li routerLinkActive="active" title="Mailing">
            <a routerLink="/mailing" style="display: flex; align-items: center; width: 100%; color: inherit; text-decoration: none; gap: 12px;">
                <i class="fa-solid fa-envelope" style="width: 20px; text-align: center;"></i>
                <span class="nav-text">Mailing</span>
            </a>
        </li>
        <li routerLinkActive="active" title="CVE Analysis">
            <a routerLink="/cve-analysis" style="display: flex; align-items: center; width: 100%; color: inherit; text-decoration: none; gap: 12px;">
                <i class="fa-solid fa-bug" style="width: 20px; text-align: center;"></i>
                <span class="nav-text">CVE Analysis</span>
            </a>
        </li>
        <li routerLinkActive="active" title="Services">
            <a routerLink="/services" style="display: flex; align-items: center; width: 100%; color: inherit; text-decoration: none; gap: 12px;">
                <i class="fa-solid fa-scroll" style="width: 20px; text-align: center;"></i>
                <span class="nav-text">Services</span>
            </a>
        </li>
        <li routerLinkActive="active" title="Settings">
            <a routerLink="/settings" style="display: flex; align-items: center; width: 100%; color: inherit; text-decoration: none; gap: 12px;">
                <i class="fa-solid fa-gear" style="width: 20px; text-align: center;"></i>
                <span class="nav-text">Settings</span>
            </a>
        </li>
    </ul>
</aside>
