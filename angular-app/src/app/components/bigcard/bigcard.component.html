<div class="chart-container" 
     [class.interactive]="isInteractive" 
     [routerLink]="isInteractive ? routerLinkTarget : null">
    <div style="width: 100%; flex-shrink: 0;">
        <h3 style="margin-bottom: 15px; color: var(--text-muted); font-size: 1rem; text-align: left;">{{ title }}</h3>
    </div>
    <div style="flex-grow: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; min-height: 0;">
        <ng-content></ng-content>
    </div>
</div>
