# Chiave univoca del progetto su SonarQube
sonar.projectKey=covenant
sonar.projectName=Covenant
sonar.projectVersion=1.0

# Directory root da analizzare (verranno scansionate in modo ricorsivo)
# Includiamo il frontend, il backend e il dataservice
sonar.sources=angular-app/src,back-end/src,dataservice/src

# File e cartelle da ESCLUDERE dall'analisi (es. test, dipendenze, file autogenerati)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.spec.ts,**/*.test.ts,**/data/inv.db

# File o cartelle specifiche per la reportistica dei test (opzionale per ora)
# sonar.tests=...
# sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Linguaggi principali per cui forzare l'analisi
sonar.language=ts,js,html,css,python

# Codifica file
sonar.sourceEncoding=UTF-8
